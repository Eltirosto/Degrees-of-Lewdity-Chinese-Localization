      parameters:
        - '|+ "awareness"|"beauty"|"confidence"|"deviancy"|"dominance"|"exhibitionism"|"jealousy"|"love"|"lust"|"physique"|"promiscuity"|"rage"|"trauma"|"willpower"|"fear"'
