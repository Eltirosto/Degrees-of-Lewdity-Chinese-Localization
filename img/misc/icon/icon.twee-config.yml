    watericon:
      description: |-
        Prints a composite water icon of `deco` + `waterbase`

        Usage:
        `<<watericon "watertype[-location or -specialstate]">>`
        The `_location` and `_specialstate` are optional.
        Examples:
        `<<watericon "waterfall">>`
        `<<watericon "waterfall-wolfcave">>`
        `<<watericon "pond-frozen">>`

        Available waterbase:
        ![waterfall](./waterfall-base.gif)
        ![waterside](./waterside-base.gif)
        ![stream](./stream-base.gif)
        ![pond](./pond-base.gif)

        Available deco types:
        | waterbase  | deco options         |
        |------------|----------------------|
        | waterfall  | "rock", "rockgreen"  |
        | waterside  | "soil"               |
        | stream     | "grass", "rock"      |
        | pond       | "grass"              |
      tags: ["img"]
